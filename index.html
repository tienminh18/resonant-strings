<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover + the safe-area insets in style.css keep the
         bottom copy clear of the iPhone home indicator. Without the meta tag
         at all, mobile Safari/Chrome lay the page out at 980px and scale it
         down, which shrank the cloth and the roof to illegible. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6c96b">
    <title>Strings</title>
    <link rel="icon" href="data:,">
    <!-- The two subsets the cloth's glyph atlas cannot do without. Preloaded so
         the download starts with the HTML rather than after style.css has been
         fetched and parsed — the atlas is rasterised once and whatever font is
         available at that instant is what the whole session gets.
         crossorigin is required on font preloads even same-origin: without it
         the browser fetches the file a second time instead of reusing this one. -->
    <link rel="preload" href="./fonts/source-code-pro-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="./fonts/source-code-pro-vietnamese.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="./style.css?v=58">

  </head>

  <body>
  <header class="topbar">
    <span class="brand">tienminh</span>
    <!-- <a class="credit" href="https://codepen.io/shubniggurath/pen/ZYpjorm" target="_blank" rel="noopener noreferrer">* vật lý dây — Liam Egan</a> -->
  </header>

  <div id="container" class="strings"></div>

  <div class="bottom-copy">
    <section class="heading">
      <p class="eyebrow"><strong>Đôi lời</strong> gửi vào từng sợi dây</p>
      <h1>Nếu chữ hoá thành dây, mong chúng vẫn ngân lên như hôm nay</h1>
    </section>
    <div class="aside-block">
      <p class="aside">Mỗi cái chạm là một nốt chuông. Kéo, thả, và nghe văn bản ngân theo cách riêng của nó.</p>
    </div>
  </div>
    <script type="module" src="./script.js?v=58"></script>

  </body>

</html>
